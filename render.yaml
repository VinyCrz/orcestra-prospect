# Blueprint do Render: front + API num serviço só (Docker) + Redis gerenciado (Key Value), no plano grátis.
# O banco fica na Neon (o Postgres gratuito do Render expira em 30 dias). Passo a passo: docs/deploy.md.
services:
  - type: web
    name: orcestra-prospect
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    # Passa pelo front e pela API, mas não consulta o banco: a Neon pode hibernar
    healthCheckPath: /api/health/vivo
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - apps/web/**
        - packages/shared/**
        - deploy/render/**
        - data/ejs.json
        - data/federacoes.json
        - pnpm-lock.yaml
        - package.json
    envVars:
      - key: NODE_ENV
        value: production
      # Porta pública (front). A API escuta só por dentro, na 3001.
      - key: PORT
        value: '3000'
      - key: API_PORT
        value: '3001'
      - key: COOKIE_SECURE
        value: 'true'
      - key: SEED_DATA_DIR
        value: /app/data
      - key: WEB_URL
        value: https://orcestra-prospect.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orcestra-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Preenchidos no painel, na criação (ver docs/deploy.md)
      - key: DATABASE_URL
        sync: false
      - key: SUPRESSAO_PEPPER
        sync: false

  - type: keyvalue
    name: orcestra-redis
    plan: free
    region: virginia
    # BullMQ exige noeviction
    maxmemoryPolicy: noeviction
    ipAllowList: []

# Blueprint do Render: API (Docker) + Redis gerenciado (Key Value), ambos no plano gratuito.
# O banco fica na Neon (o Postgres gratuito do Render expira em 30 dias). Passo a passo: docs/deploy.md.
services:
  - type: web
    name: orcestra-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Não consulta o banco: deixa a Neon hibernar quando ninguém usa
    healthCheckPath: /health/vivo
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - data/ejs.json
        - data/federacoes.json
        - pnpm-lock.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: API_PORT
        value: '3001'
      - key: COOKIE_SECURE
        value: 'true'
      - key: SEED_DATA_DIR
        value: /app/data
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orcestra-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Preenchidos no painel, na criação (ver docs/deploy.md)
      - key: DATABASE_URL
        sync: false
      - key: SUPRESSAO_PEPPER
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: WEB_URL
        sync: false

  - type: keyvalue
    name: orcestra-redis
    plan: free
    region: virginia
    # BullMQ exige noeviction
    maxmemoryPolicy: noeviction
    ipAllowList: []

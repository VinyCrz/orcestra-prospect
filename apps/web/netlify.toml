# Front (Next.js) na Netlify. No painel: Base directory = (vazio), Package directory = apps/web.
# Os caminhos abaixo são relativos à raiz do repositório.
[build]
  command = "pnpm --filter @orcestra/shared build && pnpm --filter @orcestra/web build"
  publish = "apps/web/.next"
  # Pula o build (economiza créditos do plano grátis) quando o push não mexe no front
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/shared pnpm-lock.yaml package.json"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"